<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход — FreedomChat</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #101827;
            color: white;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 32px;
            background: #1e293b;
            border-radius: 18px;
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        p {
            text-align: center;
            color: #cbd5e1;
        }

        label {
            display: block;
            margin-top: 20px;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 14px;
            border-radius: 9px;
            border: 1px solid #64748b;
            background: #0f172a;
            color: white;
            font-size: 16px;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 25px;
            border: none;
            border-radius: 9px;
            background: #3b82f6;
            color: white;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        button:hover {
            background: #2563eb;
        }

        a {
            color: #93c5fd;
        }

        .register {
            text-align: center;
            margin-top: 22px;
        }

        .message {
            padding: 12px;
            margin-top: 15px;
            border-radius: 8px;
            background: #422006;
            color: #fde68a;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>FreedomChat</h1>
    <p>Добро пожаловать!</p>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for message in messages %}
                <div class="message">{{ message }}</div>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST" action="{{ url_for('login') }}">

        <label>Email</label>
        <input
            type="email"
            name="email"
            placeholder="Введите email"
            required
        >

        <label>Пароль</label>
        <input
            type="password"
            name="password"
            placeholder="Введите пароль"
            required
        >

        <button type="submit">Войти</button>

    </form>

    <div class="register">
        Нет аккаунта?
        <a href="{{ url_for('register') }}">Регистрация</a>
    </div>

</div>

</body>
</html>
